name: ruteam-mailpit
services:
  mailpit:
    image: ghcr.io/axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    environment:
      MP_ALLOWED_HOSTS: '127.0.0.1,localhost'
      MP_DISABLE_VERSION_CHECK: 'true'
      MP_SMTP_DISABLE_RDNS: 'true'
      MP_SMTP_ALLOWED_RECIPIENTS: '^ruteam-prueba[+][0-9a-f]{16}@usc[.]edu[.]co$'
